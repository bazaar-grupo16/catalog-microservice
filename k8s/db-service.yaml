# ──────────────────────────────────────────────────────────────
# Kubernetes Service — Catalog PostgreSQL Database
# ──────────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: catalog-db
  labels:
    app: catalog-db
spec:
  type: ClusterIP
  selector:
    app: catalog-db
  ports:
    - protocol: TCP
      port: 5432
      targetPort: 5432
