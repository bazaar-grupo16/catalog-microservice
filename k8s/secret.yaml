# ──────────────────────────────────────────────────────────────
# Kubernetes Secret — Catalog PostgreSQL Database
# ──────────────────────────────────────────────────────────────

apiVersion: v1
kind: Secret
metadata:
  name: catalog-db-credentials
type: Opaque
stringData:
  DB_HOST: catalog-db
  DB_PORT: "5432"
  DB_USER: $DB_USER
  DB_PASSWORD: $DB_PASSWORD
  DB_NAME: $DB_NAME
  SPACES_KEY: $SPACES_KEY
  SPACES_SECRET: $SPACES_SECRET
  SPACES_BUCKET: $SPACES_BUCKET
  SPACES_REGION: $SPACES_REGION
  SPACES_ENDPOINT: $SPACES_ENDPOINT
  SPACES_CDN_ENDPOINT: $SPACES_CDN_ENDPOINT
  PUBLIC_APP_BASE_URL: $PUBLIC_APP_BASE_URL
