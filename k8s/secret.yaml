# ──────────────────────────────────────────────────────────────
# Kubernetes Secret — Catalog PostgreSQL Database
# ──────────────────────────────────────────────────────────────

apiVersion: v1
kind: Secret
metadata:
  name: catalag-db-credentials
type: Opaque
stringData:
  DB_HOST: catalog-db
  DB_PORT: "5432"
  DB_USER: $DB_USER
  DB_PASSWORD: $DB_PASSWORD
  DB_NAME: $DB_NAME
