# ──────────────────────────────────────────────────────────────
# Kubernetes Deployment — Catalog Microservice
# ──────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-service
  labels:
    app: catalog-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catalog-service
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
      labels:
        app: catalog-service
    spec:
      imagePullSecrets:
        - name: ghcr-login-secret
      containers:
        - name: catalog-service
          image: $IMAGE_NAME:$IMAGE_TAG
          ports:
            - containerPort: 8000
          # ── Environment from Kubernetes Secret ──────
          env:
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: catalog-db-credentials
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: catalog-db-credentials
                  key: DB_PORT
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: catalog-db-credentials
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: catalog-db-credentials
                  key: DB_PASSWORD
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: catalog-db-credentials
                  key: DB_NAME
            - name: SPACES_KEY
              valueFrom:
                secretKeyRef:
                  name: catalog-db-credentials
                  key: SPACES_KEY
            - name: SPACES_SECRET
              valueFrom:
                secretKeyRef:
                  name: catalog-db-credentials
                  key: SPACES_SECRET
            - name: SPACES_BUCKET
              valueFrom:
                secretKeyRef:
                  name: catalog-db-credentials
                  key: SPACES_BUCKET
            - name: SPACES_REGION
              valueFrom:
                secretKeyRef:
                  name: catalog-db-credentials
                  key: SPACES_REGION
            - name: SPACES_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: catalog-db-credentials
                  key: SPACES_ENDPOINT
            - name: SPACES_CDN_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: catalog-db-credentials
                  key: SPACES_CDN_ENDPOINT
            - name: PUBLIC_APP_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: catalog-db-credentials
                  key: PUBLIC_APP_BASE_URL
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: catalog-db-credentials
                  key: SECRET_KEY
            - name: JWT_ALGORITHM
              valueFrom:
                secretKeyRef:
                  name: catalog-db-credentials
                  key: JWT_ALGORITHM
            - name: INVENTORY_SERVICE_URL
              value: "http://inventory-service"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector:4317"
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: "grpc"
            - name: OTEL_SERVICE_NAME
              value: catalog-service
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "deployment.environment=dev,k8s.cluster.name=bazaar-dev"
            - name: OTEL_PROPAGATORS
              value: "tracecontext,baggage"
            - name: OTEL_LOGS_EXPORTER
              value: "none"
            - name: OTEL_TRACES_EXPORTER
              value: "otlp"
            - name: OTEL_METRICS_EXPORTER
              value: "otlp"
          livenessProbe:
            httpGet:
              path: /livez
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
          # ── Resources ──────────────────────────────
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 256Mi
